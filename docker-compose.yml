services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: diffpdf
      POSTGRES_USER: diffpdf
      POSTGRES_PASSWORD: diffpdf
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Optional Microsoft SQL Server alternative to PostgreSQL. Start it with
  #   docker compose --profile sqlserver up
  # and switch diffpdf-api to use ConnectionStrings__SqlServer (see below).
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["sqlserver"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_password123"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: diffpdf
      RABBITMQ_DEFAULT_PASS: diffpdf
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  diffpdf-api:
    build: .
    depends_on:
      - postgres
      - rabbitmq
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=diffpdf;Username=diffpdf;Password=diffpdf
      # To use SQL Server instead, start the sqlserver profile, comment out the
      # Postgres line above and uncomment the next one (SqlServer takes priority):
      # ConnectionStrings__SqlServer: Server=sqlserver,1433;Database=diffpdf;User Id=sa;Password=Your_password123;TrustServerCertificate=True
      ConnectionStrings__RabbitMq: amqp://diffpdf:diffpdf@rabbitmq:5672/
      Storage__RootPath: /data/storage
      DIFFPDF_LOG_DIR: /data/logs
    volumes:
      # Mount the folders you want to compare (read-only) and a writable data dir.
      - ./samples/old:/pdfs/old:ro
      - ./samples/new:/pdfs/new:ro
      - diffpdf-data:/data

volumes:
  postgres-data:
  sqlserver-data:
  rabbitmq-data:
  diffpdf-data:
