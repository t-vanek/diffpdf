name: Package

# Packs the client SDK NuGet and uploads it as a workflow artifact.
# No registry/feed publishing (no secrets required).
on:
  push:
    branches: ["main"]
    tags: ["v*"]

jobs:
  nuget:
    name: Pack SDK NuGet (artifact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Compute version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack
        run: dotnet pack src/DiffPdf.Client/DiffPdf.Client.csproj -c Release -o nupkg -p:Version=${{ steps.ver.outputs.version }}

      - name: Upload .nupkg
        uses: actions/upload-artifact@v4
        with:
          name: DiffPdf.Client-nupkg
          path: nupkg/*.nupkg
          if-no-files-found: error
