name: Client Bundle

# Manual package for testers/admins: builds a self-contained desktop client bundle, publishes
# it to the GitHub Releases list, and also uploads it as a workflow artifact.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version suffix for the ZIP name; empty = 0.0.0-client.<run number>"
        required: false
        default: ""
      runtime:
        description: "Runtime identifier"
        required: true
        default: "win-x64"
        type: choice
        options:
          - win-x64
          - win-arm64
      self-contained:
        description: "Bundle the .NET runtime"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: client-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-bundle:
    name: Build client ZIP
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'.Trim()
          if ([string]::IsNullOrWhiteSpace($version)) {
              $version = "0.0.0-client.${env:GITHUB_RUN_NUMBER}"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish client bundle
        shell: pwsh
        run: |
          $selfContained = [System.Convert]::ToBoolean('${{ inputs['self-contained'] }}')
          ./deploy/publish.ps1 `
              -Version '${{ steps.ver.outputs.version }}' `
              -Runtime '${{ inputs.runtime }}' `
              -OutDir publish `
              -SelfContained:$selfContained `
              -ClientOnly

      - name: Publish ZIP to GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.ver.outputs.version }}'
          $runtime = '${{ inputs.runtime }}'
          $tag = "client-bundle-v$version"
          $title = "Client Bundle $version"
          $asset = "publish/DiffPdf-Client-$version-$runtime.zip"
          $notes = @(
              "Manual client bundle built from ``$env:GITHUB_SHA``.",
              "",
              "Download and run ``DiffPdf-Client-$version-$runtime.zip`` on a Windows workstation."
          ) -join "`n"

          $releaseExists = $false
          try {
              gh release view $tag *> $null
              $releaseExists = $LASTEXITCODE -eq 0
          }
          catch {
              $releaseExists = $false
          }

          if ($releaseExists) {
              gh release upload $tag $asset --clobber
          }
          else {
              gh release create $tag $asset --title $title --notes $notes --target $env:GITHUB_SHA
          }

      - name: Upload client ZIP
        uses: actions/upload-artifact@v4
        with:
          name: DiffPdf-Client-${{ steps.ver.outputs.version }}-${{ inputs.runtime }}
          path: publish/DiffPdf-Client-${{ steps.ver.outputs.version }}-${{ inputs.runtime }}.zip
          if-no-files-found: error
          retention-days: 30
