name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore DiffPdf.slnx

      - name: Build
        run: dotnet build DiffPdf.slnx -c Release --no-restore

      - name: Test
        run: dotnet test DiffPdf.slnx -c Release --no-build --verbosity normal
